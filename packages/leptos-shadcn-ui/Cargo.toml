# Modern Rust features
modern-rust = []
leptos-v0-8 = []
wasm-optimized = []
quality-assured = []

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.playground]
components = ["button", "card", "input", "dialog"]

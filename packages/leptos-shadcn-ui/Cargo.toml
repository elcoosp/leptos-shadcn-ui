input-group = ["leptos-shadcn-input-group"]
native-select = ["leptos-shadcn-native-select"]
toggle-group = ["leptos-shadcn-toggle-group"]
sidebar = ["leptos-shadcn-sidebar"]
sonner = ["leptos-shadcn-sonner"]
chart = ["leptos-shadcn-chart"]
form = ["leptos-shadcn-form"]
combobox = ["leptos-shadcn-combobox"]
command = ["leptos-shadcn-command"]
input-otp = ["leptos-shadcn-input-otp"]
breadcrumb = ["leptos-shadcn-breadcrumb"]
navigation-menu = ["leptos-shadcn-navigation-menu"]
context-menu = ["leptos-shadcn-context-menu"]
dropdown-menu = ["leptos-shadcn-dropdown-menu"]

[package]
name = "leptos-shadcn-ui"
version.workspace = true
edition.workspace = true
description = "A comprehensive collection of beautiful, accessible UI components built for Leptos v0.9, inspired by shadcn/ui. Features production-ready infrastructure with automated WASM testing, E2E integration, performance benchmarking, and accessibility automation. Core components with cross-browser compatibility and WCAG compliance. Fully compatible with the Leptos v0.9 attribute system."
homepage = "https://github.com/cloud-shuttle/leptos-shadcn-ui"
repository = "https://github.com/cloud-shuttle/leptos-shadcn-ui"
license = "MIT"
authors = ["CloudShuttle <info@cloudshuttle.com>"]
keywords = ["leptos", "ui", "components", "shadcn", "web"]
categories = ["wasm", "gui", "web-programming"]
readme = "../../README.md"

[dependencies]
# Core Leptos dependencies (v0.8.x)
leptos = "0.9.0-rc0"
leptos_router = "0.9.0-rc0"
leptos-node-ref = "0.2"
leptos-struct-component = "0.2"
leptos-style = "0.2"

# Individual component packages (published dependencies for v0.9.0 release)
leptos-shadcn-button = { workspace = true, optional = true }
leptos-shadcn-input = { workspace = true, optional = true }
leptos-shadcn-label = { workspace = true, optional = true }
leptos-shadcn-checkbox = { workspace = true, optional = true }
leptos-shadcn-switch = { workspace = true, optional = true }
leptos-shadcn-radio-group = { workspace = true, optional = true }
leptos-shadcn-select = { workspace = true, optional = true }
leptos-shadcn-textarea = { workspace = true, optional = true }
leptos-shadcn-card = { workspace = true, optional = true }
leptos-shadcn-separator = { workspace = true, optional = true }
leptos-shadcn-tabs = { workspace = true, optional = true }
leptos-shadcn-accordion = { workspace = true, optional = true }
leptos-shadcn-dialog = { workspace = true, optional = true }
leptos-shadcn-popover = { workspace = true, optional = true }
leptos-shadcn-tooltip = { workspace = true, optional = true }
leptos-shadcn-alert = { workspace = true, optional = true }
leptos-shadcn-badge = { workspace = true, optional = true }
leptos-shadcn-skeleton = { workspace = true, optional = true }
leptos-shadcn-progress = { workspace = true, optional = true }
leptos-shadcn-toast = { workspace = true, optional = true }
leptos-shadcn-table = { workspace = true, optional = true }
leptos-shadcn-calendar = { workspace = true, optional = true }
leptos-shadcn-date-picker = { workspace = true, optional = true }
leptos-shadcn-pagination = { workspace = true, optional = true }
leptos-shadcn-slider = { workspace = true, optional = true }
leptos-shadcn-toggle = { workspace = true, optional = true }
leptos-shadcn-carousel = { workspace = true, optional = true }
leptos-shadcn-button-group = { workspace = true, optional = true }
leptos-shadcn-kbd = { workspace = true, optional = true }
leptos-shadcn-spinner = { workspace = true, optional = true }
leptos-shadcn-empty = { workspace = true, optional = true }
leptos-shadcn-item = { workspace = true, optional = true }
leptos-shadcn-typography = { workspace = true, optional = true }
leptos-shadcn-field = { workspace = true, optional = true }
leptos-shadcn-input-group = { workspace = true, optional = true }
leptos-shadcn-native-select = { workspace = true, optional = true }
leptos-shadcn-toggle-group = { workspace = true, optional = true }
leptos-shadcn-sidebar = { workspace = true, optional = true }
leptos-shadcn-sonner = { workspace = true, optional = true }
leptos-shadcn-chart = { workspace = true, optional = true }

# Advanced components (published dependencies for v0.9.0 release)
leptos-shadcn-form = { workspace = true, optional = true }
leptos-shadcn-combobox = { workspace = true, optional = true }
leptos-shadcn-command = { workspace = true, optional = true }
leptos-shadcn-input-otp = { workspace = true, optional = true }
leptos-shadcn-breadcrumb = { workspace = true, optional = true }
leptos-shadcn-navigation-menu = { workspace = true, optional = true }
leptos-shadcn-context-menu = { workspace = true, optional = true }
leptos-shadcn-dropdown-menu = { workspace = true, optional = true }
leptos-shadcn-menubar = { workspace = true, optional = true }
leptos-shadcn-hover-card = { workspace = true, optional = true }
leptos-shadcn-aspect-ratio = { workspace = true, optional = true }
leptos-shadcn-collapsible = { workspace = true, optional = true }
leptos-shadcn-scroll-area = { workspace = true, optional = true }
leptos-shadcn-sheet = { workspace = true, optional = true }
leptos-shadcn-drawer = { workspace = true, optional = true }
leptos-shadcn-alert-dialog = { workspace = true, optional = true }
leptos-shadcn-avatar = { workspace = true, optional = true }
leptos-shadcn-resizable = { workspace = true, optional = true }
leptos-shadcn-performance-audit = { workspace = true, optional = true }

# Additional packages (published dependencies for v0.9.0 release)
leptos-shadcn-error-boundary = { workspace = true, optional = true }
leptos-shadcn-lazy-loading = { workspace = true, optional = true }
leptos-shadcn-registry = { workspace = true, optional = true }
leptos-shadcn-analytics = { workspace = true, optional = true }

# Additional dependencies
tailwind_fuse = "0.3"
gloo-timers = "0.3"

# WASM-compatible dependencies
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1.20", features = ["v4", "js"] }

[features]
default = ["all-components"]
all-components = [
    "button", "input", "label", "checkbox", "switch", "radio-group", "select", "textarea",
    "card", "separator", "tabs", "accordion", "dialog", "popover", "tooltip",
    "alert", "badge", "skeleton", "progress", "toast", "table", "calendar", "date-picker", "pagination",
    "slider", "toggle", "carousel",
    "form", "combobox", "command", "input-otp", "breadcrumb", "navigation-menu", "context-menu",
    "dropdown-menu", "menubar", "hover-card", "aspect-ratio", "collapsible", "scroll-area",
    "sheet", "drawer", "alert-dialog", "avatar", "resizable", "error-boundary", "lazy-loading", "performance-audit",
    "analytics",
    "button-group", "kbd", "spinner", "empty", "item", "typography", "field", "input-group", "native-select", "toggle-group", "sidebar", "sonner", "chart"
]

# Individual component features
button = ["leptos-shadcn-button"]
input = ["leptos-shadcn-input"]
label = ["leptos-shadcn-label"]
checkbox = ["leptos-shadcn-checkbox"]
switch = ["leptos-shadcn-switch"]
radio-group = ["leptos-shadcn-radio-group"]
select = ["leptos-shadcn-select"]
textarea = ["leptos-shadcn-textarea"]
card = ["leptos-shadcn-card"]
separator = ["leptos-shadcn-separator"]
tabs = ["leptos-shadcn-tabs"]
accordion = ["leptos-shadcn-accordion"]
dialog = ["leptos-shadcn-dialog"]
popover = ["leptos-shadcn-popover"]
tooltip = ["leptos-shadcn-tooltip"]
